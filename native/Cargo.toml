[package]
name = "support-privacy-native"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Local-only Rust privacy gateway and CLI"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "limit", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-normalization = "0.1"
aes-gcm = "0.10"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
